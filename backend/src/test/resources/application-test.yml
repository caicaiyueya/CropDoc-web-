spring:
  datasource:
    url: jdbc:h2:mem:yunnong_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
  main:
    allow-bean-definition-overriding: true

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: test_jwt_secret_key_at_least_32_bytes_long!!
  expiration-ms: 86400000

app:
  upload:
    base-path: ./uploads-test
    url-prefix: /uploads

deepseek:
  api-key: test_key_not_used
  base-url: http://localhost:9
  vision-model: deepseek-chat
  chat-model: deepseek-chat
  connect-timeout-ms: 1000
  read-timeout-ms: 1000
